services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
      # 토스 mTLS 인증서. 파일이 없으면 무시됩니다.
      - ./secrets:/app/secrets:ro
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
