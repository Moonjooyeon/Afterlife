name: afterlife
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: afterlife
      POSTGRES_USER: afterlife
      POSTGRES_PASSWORD: ${AF_DB_PASSWORD:?Set AF_DB_PASSWORD in .env}
    volumes:
      - afterlife-db:/var/lib/postgresql/data
    networks: [afterlife]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U afterlife -d afterlife"]
      interval: 10s
      timeout: 5s
      retries: 6
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      RUNTIME_DIR: /app/runtime
      DATABASE_URL: postgresql://afterlife:${AF_DB_PASSWORD:?Set AF_DB_PASSWORD}@db:5432/afterlife
      TOSS_MTLS_CERT_PATH: /app/secrets/toss/unread_public.crt
      TOSS_MTLS_KEY_PATH: /app/secrets/toss/unread_private.key
    volumes:
      - ./runtime:/app/runtime
      - ./secrets/toss:/app/secrets/toss:ro
    networks: [afterlife]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports: ["127.0.0.1:8082:80"]
    volumes:
      - ./docker/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [afterlife, levelup-net]
    depends_on:
      backend:
        condition: service_healthy
networks:
  afterlife:
  levelup-net:
    external: true
    name: levelup-net
volumes:
  afterlife-db:
